<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMO — Official Store</title>
    <!-- Google Sheet CSV पढ़ने के लिए PapaParse Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #fcfcfc; color: #111; padding-bottom: 90px; }

        .announcement { background: #111; color: #fff; text-align: center; padding: 7px 10px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

        /* Navbar Header */
        header { background: #fff; position: sticky; top: 0; z-index: 900; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .menu-btn { font-size: 22px; cursor: pointer; background: none; border: none; }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #111; text-decoration: none; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .icon-btn { font-size: 18px; cursor: pointer; background: none; border: none; position: relative; }
        .badge-count { position: absolute; top: -6px; right: -8px; background: #e63946; color: white; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 10px; }

        /* Search Bar Section */
        .search-container { padding: 10px 15px; background: #fff; border-bottom: 1px solid #eee; }
        .search-box { display: flex; align-items: center; background: #f2f2f2; border-radius: 6px; padding: 8px 12px; }
        .search-box input { border: none; background: transparent; width: 100%; font-size: 13px; outline: none; margin-left: 8px; }

        /* Sidebar Drawer */
        .sidebar { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: #fff; z-index: 1000; transition: 0.3s ease; box-shadow: 4px 0 15px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .sidebar-title { font-weight: 800; letter-spacing: 1px; }
        .close-sidebar { font-size: 24px; border: none; background: none; cursor: pointer; }
        .menu-list { list-style: none; }
        .menu-list li { border-bottom: 1px solid #f5f5f5; }
        .menu-list a { display: block; padding: 14px 0; color: #222; font-weight: 600; font-size: 13px; letter-spacing: 1px; text-decoration: none; text-transform: uppercase; }

        /* Container & Grid */
        .container { max-width: 1100px; margin: 15px auto; padding: 0 10px; }
        .section-title { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; padding-left: 4px; color: #444; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 768px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; }
        }

        /* Product Card */
        .product-card { background: #fff; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; position: relative; border: 1px solid #eee; }
        .wishlist-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.85); border: none; font-size: 16px; padding: 4px 6px; border-radius: 50%; cursor: pointer; z-index: 2; }
        .wishlist-btn.active { color: red; }

        .img-container { width: 100%; height: 200px; background: #f9f9f9; overflow: hidden; }
        .main-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        .card-body { padding: 10px; text-align: left; }
        .rating-box { font-size: 11px; color: #ffa41c; font-weight: bold; margin-bottom: 4px; }
        .review-count { color: #777; font-weight: normal; font-size: 10px; }
        .product-title { font-size: 12px; font-weight: 600; color: #222; text-transform: uppercase; margin-bottom: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .product-price { font-size: 14px; font-weight: 800; color: #111; margin-bottom: 8px; }

        .size-box { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
        .size-btn { border: 1px solid #ccc; background: #fff; font-size: 10px; padding: 3px 6px; font-weight: 600; cursor: pointer; border-radius: 2px; }
        .size-btn.selected { background: #111; color: #fff; border-color: #111; }

        .add-btn { background: #111; color: #fff; border: none; width: 100%; padding: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 2px; }

        /* Cart Section */
        .cart-section { background: #fff; border-top: 2px solid #111; padding: 15px; margin-top: 30px; }
        .checkout-btn { background: #25D366; color: white; margin-top: 15px; font-weight: 700; font-size: 14px; text-align: center; text-decoration: none; padding: 12px; border-radius: 4px; border: none; width: 100%; cursor: pointer; display: block; }

        /* Modal Popups (Login / Zoom) */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; padding: 15px; }
        .login-box { background: #fff; width: 100%; max-width: 350px; padding: 20px; border-radius: 8px; text-align: center; position: relative; }
        .login-box input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .login-box button { width: 100%; padding: 10px; background: #111; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 20px; border: none; background: none; cursor: pointer; }

        .modal-content { max-width: 90%; max-height: 80vh; object-fit: contain; }
        
        .loading-box { text-align: center; grid-column: 1/-1; padding: 40px 0; }
        .spinner { border: 3px solid #eee; border-top: 3px solid #111; border-radius: 50%; width: 35px; height: 35px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="announcement">🚚 FREE SHIPPING ON ORDERS ABOVE ₹999 | CASH ON DELIVERY AVAILABLE</div>

    <!-- Header Navigation -->
    <header>
        <div class="nav-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <a href="#" class="logo">SUMO</a>
        </div>
        <div class="nav-right">
            <button class="icon-btn" onclick="openLoginModal()" title="Login">👤</button>
            <button class="icon-btn" onclick="scrollToCart()" title="Wishlist">❤️ <span class="badge-count" id="wishlist-count">0</span></button>
            <button class="icon-btn" onclick="scrollToCart()" title="Cart">🛒 <span class="badge-count" id="cart-count">0</span></button>
        </div>
    </header>

    <!-- Search Bar Section -->
    <div class="search-container">
        <div class="search-box">
            🔍 <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search T-shirts, Jeans, Accessories...">
        </div>
    </div>

    <!-- Sidebar Drawer -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">SUMO STORE</span>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="menu-list">
            <li><a href="#" onclick="openLoginModal()">ACCOUNT / LOGIN</a></li>
            <li><a href="#" onclick="toggleSidebar()">SHOP ALL</a></li>
            <li><a href="#" onclick="toggleSidebar()">TOPWEAR</a></li>
            <li><a href="#" onclick="toggleSidebar()">BOTTOMWEAR</a></li>
        </ul>
    </div>

    <!-- Main Content Grid -->
    <div class="container">
        <div class="section-title">ALL PRODUCTS</div>
        
        <div class="products-grid" id="products-container">
            <div class="loading-box">
                <div class="spinner"></div>
                <p style="font-size: 12px; font-weight:600;">LOADING PRODUCTS...</p>
            </div>
        </div>

        <!-- Cart Section -->
        <div class="cart-section" id="cart-section">
            <h3 style="font-size: 15px; font-weight:800; text-transform:uppercase;">YOUR SHOPPING BAG 🛒</h3>
            <div id="cart-items" style="margin: 15px 0; font-size: 13px;"><p>आपकी कार्ट अभी खाली है।</p></div>
            <div id="cart-total" style="font-weight:800; font-size:16px;">TOTAL: ₹0</div>
            <button class="checkout-btn" onclick="goToCheckout()">PROCEED TO ORDER ➡️</button>
        </div>
    </div>

    <!-- Login Popup Modal -->
    <div id="loginModal" class="modal">
        <div class="login-box">
            <button class="close-modal" onclick="closeLoginModal()">✕</button>
            <h3 style="margin-bottom: 10px;">User Login</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Enter details to manage orders</p>
            <input type="text" placeholder="Full Name">
            <input type="tel" placeholder="Mobile Number">
            <button onclick="saveLogin()">LOGIN</button>
        </div>
    </div>

    <!-- Image Zoom Lightbox -->
    <div id="imageModal" class="modal" onclick="closeZoomModal()">
        <img class="modal-content" id="zoomedImg">
    </div>

    <script>
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vThrlGrx6ZmotFLV7UhtCupWp0chlqiQgZSSVq01eqmIlg6m83-p6_Bz7UvY1DfGs6AvB1HZbexhexo/pub?output=csv';

        let allProductsData = [];
        let cart = [];
        let wishlist = [];
        let selectedSizes = {};

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
        function saveLogin() { alert('Login Successful!'); closeLoginModal(); }
        function scrollToCart() { document.getElementById('cart-section').scrollIntoView({ behavior: 'smooth' }); }

        function loadProductsFromSheet() {
            Papa.parse(sheetCsvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allProductsData = results.data;
                    renderProducts(allProductsData);
                }
            });
        }

        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            let count = 0;

            products.forEach((product, index) => {
                const name = product.Name || product.name || product.NAME;
                const price = product.Price || product.price || product.PRICE;
                const imageStr = product.Image || product.image || product.IMAGE;
                const size = product.Size || product.size || product.SIZE;

                if (name && price && imageStr) {
                    count++;
                    const images = imageStr.split(',').map(img => img.trim());
                    const mainImgUrl = images[0];

                    let sizeHtml = '';
                    if (size && size.trim() !== '') {
                        const sizes = size.split(',');
                        sizeHtml = '<div class="size-box">';
                        sizes.forEach((s, sIndex) => {
                            const sz = s.trim();
                            sizeHtml += `<button class="size-btn ${sIndex === 0 ? 'selected' : ''}" onclick="selectSize(${index}, '${sz}', this)">${sz}</button>`;
                        });
                        sizeHtml += '</div>';
                        selectedSizes[index] = sizes[0].trim();
                    }

                    // फ़ेक स्टार रेटिंग ऑटो-जनरेट (4.2★ - 4.9★)
                    const rating = (4 + (index % 8) / 10).toFixed(1);
                    const reviewCount = 25 + (index * 7);

                    const isWishlisted = wishlist.includes(name);

                    const card = `
                        <div class="product-card">
                            <button class="wishlist-btn ${isWishlisted ? 'active' : ''}" onclick="toggleWishlist('${name}', this)">♥</button>
                            <div class="img-container">
                                <img src="${mainImgUrl}" class="main-img" alt="${name}" onclick="openZoomModal('${mainImgUrl}')">
                            </div>
                            <div class="card-body">
                                <div class="rating-box">★ ${rating} <span class="review-count">(${reviewCount})</span></div>
                                <div class="product-title">${name}</div>
                                <div class="product-price">₹${price}</div>
                                ${sizeHtml}
                                <button class="add-btn" onclick="addToCart('${name}', ${price}, ${index})">ADD TO BAG 🛒</button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
            });

            if (count === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">कोई प्रोडक्ट नहीं मिला।</p>';
            }
        }

        /* Search Filter Function */
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProductsData.filter(p => {
                const name = (p.Name || p.name || p.NAME || '').toLowerCase();
                return name.includes(query);
            });
            renderProducts(filtered);
        }

        /* Wishlist Toggle */
        function toggleWishlist(name, btn) {
            if (wishlist.includes(name)) {
                wishlist = wishlist.filter(item => item !== name);
                btn.classList.remove('active');
            } else {
                wishlist.push(name);
                btn.classList.add('active');
            }
            document.getElementById('wishlist-count').innerText = wishlist.length;
        }

        function selectSize(cardIndex, sizeValue, btnElement) {
            selectedSizes[cardIndex] = sizeValue;
            const parent = btnElement.parentElement;
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
        }

        function openZoomModal(src) {
            document.getElementById('imageModal').style.display = 'flex';
            document.getElementById('zoomedImg').src = src;
        }

        function closeZoomModal() { document.getElementById('imageModal').style.display = 'none'; }

        function addToCart(name, price, index) {
            const chosenSize = selectedSizes[index];
            const itemTitle = chosenSize ? `${name} (Size: ${chosenSize})` : name;
            cart.push({ name: itemTitle, price: Number(price) });
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            document.getElementById('cart-count').innerText = cart.length;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p>आपकी कार्ट अभी खाली है।</p>';
                cartTotalDiv.innerText = 'TOTAL: ₹0';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                html += `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee;"><span>${item.name}</span><span>₹${item.price}</span></div>`;
            });
            cartItemsDiv.innerHTML = html;
            cartTotalDiv.innerText = `TOTAL: ₹${total}`;
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert('कृपया पहले कोई प्रोडक्ट चुनें!');
                return;
            }
            localStorage.setItem('sumoCart', JSON.stringify(cart));
            window.location.href = 'checkout.html';
        }

        loadProductsFromSheet();
    </script>
</body>
</html>
