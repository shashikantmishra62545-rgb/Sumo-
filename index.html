<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sumo - Official Store</title>
    <!-- PapaParse Library for Google Sheet CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 80px; }
        header { background: #111; color: #fff; text-align: center; padding: 20px; font-size: 28px; font-weight: bold; }
        .hero { background: #222; color: #fff; text-align: center; padding: 30px 20px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; }
        .product-title { font-size: 18px; margin: 10px 0 5px; font-weight: 600; }
        .product-price { font-size: 20px; color: #e63946; font-weight: bold; margin-bottom: 10px; }
        .size-select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn { background: #111; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; }
        .btn:hover { background: #333; }
        .cart-section { background: #fff; border-radius: 12px; padding: 20px; margin-top: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .checkout-btn { background: #25D366; color: white; margin-top: 15px; font-weight: bold; font-size: 16px; display: block; text-align: center; text-decoration: none; padding: 12px; border-radius: 6px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <header>sumo 🛍️</header>

    <div class="hero">
        <h1>Welcome to sumo Store</h1>
        <p>Best Quality Products at Affordable Prices!</p>
    </div>

    <div class="container">
        <h2 style="text-align:center; margin-bottom:20px;">Our Products 👕👖🕶️</h2>
        
        <div class="products-grid" id="products-container">
            <p style="text-align:center; grid-column: 1/-1;">लोड हो रहा है...</p>
        </div>

        <div class="cart-section">
            <h2>Your Cart 🛒</h2>
            <div id="cart-items" style="margin: 15px 0;"><p>कार्ट खाली है।</p></div>
            <div id="cart-total" style="font-weight:bold; font-size:18px;">Total: ₹0</div>
            <button class="checkout-btn" onclick="goToCheckout()">Proceed to Order ➡️</button>
        </div>
    </div>

    <script>
        // आपका Google Sheet CSV Link यहाँ सेट है:
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vThrlGrx6ZmotFLV7UhtCupWp0chlqiQgZSSVq01eqmIlg6m83-p6_Bz7UvY1DfGs6AvB1HZbexhexo/pub?output=csv';

        let cart = [];

        function loadProductsFromSheet() {
            Papa.parse(sheetCsvUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    const products = results.data;
                    const container = document.getElementById('products-container');
                    container.innerHTML = '';

                    products.forEach((product, index) => {
                        if (product.Name && product.Price && product.Image) {
                            let sizeOptions = '';
                            if (product.Size && product.Size.trim() !== '') {
                                const sizes = product.Size.split(',');
                                sizeOptions = `<select id="size-${index}" class="size-select">`;
                                sizes.forEach(s => {
                                    sizeOptions += `<option value="${s.trim()}">Size: ${s.trim()}</option>`;
                                });
                                sizeOptions += `</select>`;
                            }

                            const card = `
                                <div class="product-card">
                                    <img src="${product.Image.trim()}" alt="${product.Name}">
                                    <div class="product-title">${product.Name}</div>
                                    <div class="product-price">₹${product.Price}</div>
                                    ${sizeOptions}
                                    <button class="btn" onclick="addToCart('${product.Name}', ${product.Price}, ${index})">Add to Cart 🛒</button>
                                </div>
                            `;
                            container.innerHTML += card;
                        }
                    });
                }
            });
        }

        function addToCart(name, price, index) {
            let selectedSize = '';
            const sizeElement = document.getElementById(`size-${index}`);
            if (sizeElement) {
                selectedSize = sizeElement.value;
            }

            const itemTitle = selectedSize ? `${name} (Size: ${selectedSize})` : name;
            cart.push({ name: itemTitle, price: Number(price) });
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p>कार्ट खाली है।</p>';
                cartTotalDiv.innerText = 'Total: ₹0';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                html += `<div style="display:flex; justify-content:space-between; padding:5px 0;"><span>${item.name}</span><span>₹${item.price}</span></div>`;
            });
            cartItemsDiv.innerHTML = html;
            cartTotalDiv.innerText = `Total: ₹${total}`;
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert('कृपया पहले कोई प्रोडक्ट चुनें!');
                return;
            }
            localStorage.setItem('sumoCart', JSON.stringify(cart));
            window.location.href = 'checkout.html';
        }

        loadProductsFromSheet();
    </script>
</body>
</html>
