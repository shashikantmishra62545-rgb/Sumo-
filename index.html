<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sumo - Official Store</title>
    <!-- Google Sheet CSV पढ़ने के लिए PapaParse Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 80px; }
        header { background: #111; color: #fff; text-align: center; padding: 18px; font-size: 24px; font-weight: bold; }
        .hero { background: #222; color: #fff; text-align: center; padding: 25px 15px; }
        .hero h1 { font-size: 24px; }
        .hero p { font-size: 14px; opacity: 0.9; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 12px; }

        /* मोबाइल में 2 कॉलम (लेफ्ट और राइट) वाला ग्रिड */
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        /* बड़ी स्क्रीन / कंप्यूटर के लिए 3-4 कॉलम */
        @media (min-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
            }
        }

        .product-card { 
            background: #fff; 
            border-radius: 10px; 
            padding: 10px; 
            text-align: center; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.06); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        
        /* इमेज साइज एडजस्टमेंट */
        .main-img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; cursor: pointer; }
        
        .thumbs-container { display: flex; gap: 4px; justify-content: center; margin: 6px 0; }
        .thumb-img { width: 35px; height: 35px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; cursor: pointer; }

        .product-title { font-size: 14px; margin: 8px 0 4px; font-weight: 600; text-transform: capitalize; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .product-price { font-size: 16px; color: #e63946; font-weight: bold; margin-bottom: 8px; }
        .size-select { width: 100%; padding: 6px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; background: #fff; }
        .btn { background: #111; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 13px; font-weight: 600; }
        .btn:hover { background: #333; }
        
        .cart-section { background: #fff; border-radius: 12px; padding: 18px; margin-top: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .checkout-btn { background: #25D366; color: white; margin-top: 15px; font-weight: bold; font-size: 16px; display: block; text-align: center; text-decoration: none; padding: 12px; border-radius: 6px; border: none; width: 100%; cursor: pointer; }

        /* Loader Animation */
        .loading-box { text-align: center; grid-column: 1/-1; padding: 40px 0; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #111; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Full Screen Zoom Popup */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; }
        .modal-content { max-width: 95%; max-height: 85vh; border-radius: 8px; }
        .close-modal { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 35px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>sumo 🛍️</header>

    <div class="hero">
        <h1>Welcome to sumo Store</h1>
        <p>Best Quality Products at Affordable Prices!</p>
    </div>

    <div class="container">
        <h2 style="text-align:center; margin-bottom:15px; font-size: 20px;">Our Products 👕👖🕶️</h2>
        
        <div class="products-grid" id="products-container">
            <div class="loading-box">
                <div class="spinner"></div>
                <p style="font-weight: 600; color: #555;">प्रोडक्ट्स लोड हो रहे हैं...</p>
            </div>
        </div>

        <div class="cart-section">
            <h2>Your Cart 🛒</h2>
            <div id="cart-items" style="margin: 15px 0;"><p>कार्ट खाली है।</p></div>
            <div id="cart-total" style="font-weight:bold; font-size:18px;">Total: ₹0</div>
            <button class="checkout-btn" onclick="goToCheckout()">Proceed to Order ➡️</button>
        </div>
    </div>

    <div id="imageModal" class="modal" onclick="closeZoomModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="zoomedImg">
    </div>

    <script>
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vThrlGrx6ZmotFLV7UhtCupWp0chlqiQgZSSVq01eqmIlg6m83-p6_Bz7UvY1DfGs6AvB1HZbexhexo/pub?output=csv';

        let cart = [];

        function loadProductsFromSheet() {
            Papa.parse(sheetCsvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const products = results.data;
                    const container = document.getElementById('products-container');
                    container.innerHTML = '';

                    let count = 0;
                    products.forEach((product, index) => {
                        const name = product.Name || product.name || product.NAME;
                        const price = product.Price || product.price || product.PRICE;
                        const imageStr = product.Image || product.image || product.IMAGE;
                        const size = product.Size || product.size || product.SIZE;

                        if (name && price && imageStr) {
                            count++;
                            
                            const images = imageStr.split(',').map(img => img.trim());
                            const mainImgUrl = images[0];

                            let thumbsHtml = '';
                            if (images.length > 1) {
                                thumbsHtml = '<div class="thumbs-container">';
                                images.forEach(img => {
                                    thumbsHtml += `<img src="${img}" class="thumb-img" onclick="changeImage(${index}, '${img}')">`;
                                });
                                thumbsHtml += '</div>';
                            }

                            let sizeOptions = '';
                            if (size && size.trim() !== '') {
                                const sizes = size.split(',');
                                sizeOptions = `<select id="size-${index}" class="size-select">`;
                                sizes.forEach(s => {
                                    sizeOptions += `<option value="${s.trim()}">Size: ${s.trim()}</option>`;
                                });
                                sizeOptions += `</select>`;
                            }

                            const card = `
                                <div class="product-card">
                                    <div>
                                        <img src="${mainImgUrl}" id="main-img-${index}" class="main-img" alt="${name}" onclick="openZoomModal(this.src)">
                                        ${thumbsHtml}
                                    </div>
                                    <div class="product-title" title="${name}">${name}</div>
                                    <div class="product-price">₹${price}</div>
                                    ${sizeOptions}
                                    <button class="btn" onclick="addToCart('${name}', ${price}, ${index})">Add to Cart 🛒</button>
                                </div>
                            `;
                            container.innerHTML += card;
                        }
                    });

                    if (count === 0) {
                        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">कोई प्रोडक्ट नहीं मिला। कृपया Google Sheet चेक करें।</p>';
                    }
                }
            });
        }

        function changeImage(cardIndex, newSrc) {
            document.getElementById(`main-img-${cardIndex}`).src = newSrc;
        }

        function openZoomModal(src) {
            const modal = document.getElementById('imageModal');
            const zoomedImg = document.getElementById('zoomedImg');
            modal.style.display = 'flex';
            zoomedImg.src = src;
        }

        function closeZoomModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function addToCart(name, price, index) {
            let selectedSize = '';
            const sizeElement = document.getElementById(`size-${index}`);
            if (sizeElement) {
                selectedSize = sizeElement.value;
            }

            const itemTitle = selectedSize ? `${name} (Size: ${selectedSize})` : name;
            cart.push({ name: itemTitle, price: Number(price) });
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p>कार्ट खाली है।</p>';
                cartTotalDiv.innerText = 'Total: ₹0';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                html += `<div style="display:flex; justify-content:space-between; padding:5px 0;"><span>${item.name}</span><span>₹${item.price}</span></div>`;
            });
            cartItemsDiv.innerHTML = html;
            cartTotalDiv.innerText = `Total: ₹${total}`;
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert('कृपया पहले कोई प्रोडक्ट चुनें!');
                return;
            }
            localStorage.setItem('sumoCart', JSON.stringify(cart));
            window.location.href = 'checkout.html';
        }

        loadProductsFromSheet();
    </script>
</body>
</html>
