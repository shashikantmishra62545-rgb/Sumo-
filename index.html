<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sumo - Official Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 80px; }
        header { background: #111; color: #fff; text-align: center; padding: 20px; font-size: 28px; font-weight: bold; }
        .hero { background: #222; color: #fff; text-align: center; padding: 30px 20px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .product-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; }
        .product-title { font-size: 18px; margin: 10px 0; font-weight: 600; }
        .product-price { font-size: 20px; color: #e63946; font-weight: bold; margin-bottom: 10px; }
        .btn { background: #111; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; }
        .cart-section { background: #fff; border-radius: 12px; padding: 20px; margin-top: 30px; }
        .checkout-btn { background: #25D366; color: white; margin-top: 15px; font-weight: bold; font-size: 16px; display: block; text-align: center; text-decoration: none; padding: 12px; border-radius: 6px; }
    </style>
</head>
<body>

    <header>sumo 🛍️</header>

    <div class="hero">
        <h1>Welcome to sumo Store</h1>
        <p>Best Quality Shirt, Pant & Sunglasses!</p>
    </div>

    <div class="container">
        <h2 style="text-align:center; margin-bottom:20px;">Our Products 👕👖🕶️</h2>
        <div class="products-grid">
            <div class="product-card">
                <img src="https://i.ibb.co/Pv4fSPr6/jpg.jpg" alt="Shirt">
                <div class="product-title">Shirt</div>
                <div class="product-price">₹450</div>
                <button class="btn" onclick="addToCart('Shirt', 450)">Add to Cart 🛒</button>
            </div>
            <div class="product-card">
                <img src="https://i.ibb.co/tT4jfx9Z/camera-jpg.jpg" alt="Pant">
                <div class="product-title">Pant</div>
                <div class="product-price">₹650</div>
                <button class="btn" onclick="addToCart('Pant', 650)">Add to Cart 🛒</button>
            </div>
            <div class="product-card">
                <img src="https://i.ibb.co/yBWDwhFb/camerajpg.jpg" alt="Sunglasses">
                <div class="product-title">Sunglasses</div>
                <div class="product-price">₹150</div>
                <button class="btn" onclick="addToCart('Sunglasses', 150)">Add to Cart 🛒</button>
            </div>
        </div>

        <div class="cart-section">
            <h2>Your Cart 🛒</h2>
            <div id="cart-items" style="margin: 15px 0;"><p>कार्ट खाली है।</p></div>
            <div id="cart-total" style="font-weight:bold; font-size:18px;">Total: ₹0</div>
            <button class="checkout-btn" onclick="goToCheckout()">Proceed to Order ➡️</button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p>कार्ट खाली है।</p>';
                cartTotalDiv.innerText = 'Total: ₹0';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                html += `<div style="display:flex; justify-content:space-between; padding:5px 0;"><span>${item.name}</span><span>₹${item.price}</span></div>`;
            });
            cartItemsDiv.innerHTML = html;
            cartTotalDiv.innerText = `Total: ₹${total}`;
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert('कृपया पहले कोई प्रोडक्ट चुनें!');
                return;
            }
            // कार्ट के सामान को ब्राऊज़र की मेमोरी में सेव करना
            localStorage.setItem('sumoCart', JSON.stringify(cart));
            // दूसरे पेज पर जाना
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
