<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sumo - Official Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 80px; }
        header { background: #111; color: #fff; text-align: center; padding: 20px; font-size: 28px; font-weight: bold; letter-spacing: 2px; }
        .hero { background: #222; color: #fff; text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero p { font-size: 16px; color: #ccc; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-size: 22px; margin-bottom: 20px; text-align: center; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; padding: 15px; display: flex; flex-direction: column; justify: space-between; }
        .product-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; }
        .product-title { font-size: 18px; margin: 12px 0 6px; font-weight: 600; }
        .product-price { font-size: 20px; color: #e63946; font-weight: bold; margin-bottom: 12px; }
        .btn { background: #111; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; width: 100%; transition: 0.2s; }
        .btn:hover { background: #333; }
        .cart-section { background: #fff; border-radius: 12px; padding: 20px; margin-top: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .cart-total { font-size: 20px; font-weight: bold; text-align: right; margin-top: 15px; }
        .form-group { margin-top: 15px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 5px; }
        .whatsapp-btn { background: #25D366; color: white; margin-top: 15px; font-weight: bold; font-size: 16px; }
        .whatsapp-btn:hover { background: #1ebc57; }
    </style>
</head>
<body>

    <header>sumo 🛍️</header>

    <section class="hero">
        <h1>Welcome to sumo Store</h1>
        <p>Best Quality Shirt, Pant & Sunglasses at Affordable Prices!</p>
    </section>

    <div class="container">
        <h2 class="section-title">Our Products 👕👖🕶️</h2>
        <div class="products-grid">
            
            <!-- Shirt -->
            <div class="product-card">
                <img src="https://ibb.co/GvJmrh5t" alt="Shirt">
                <div class="product-title">Shirt</div>
                <div class="product-price">₹450</div>
                <button class="btn" onclick="addToCart('Shirt', 450)">Add to Cart 🛒</button>
            </div>

            <!-- Pant -->
            <div class="product-card">
                <img src="https://ibb.co/PZVdxnTL" alt="Pant">
                <div class="product-title">Pant</div>
                <div class="product-price">₹650</div>
                <button class="btn" onclick="addToCart('Pant', 650)">Add to Cart 🛒</button>
            </div>

            <!-- Sunglasses -->
            <div class="product-card">
                <img src="https://ibb.co/k6h1Pb63" alt="Sunglasses">
                <div class="product-title">Sunglasses</div>
                <div class="product-price">₹150</div>
                <button class="btn" onclick="addToCart('Sunglasses', 150)">Add to Cart 🛒</button>
            </div>

        </div>

        <!-- Cart Section -->
        <div class="cart-section">
            <h2 class="section-title">Your Cart 🛒</h2>
            <div id="cart-items">
                <p style="text-align:center; color:#777;">कार्ट खाली है।</p>
            </div>
            <div class="cart-total" id="cart-total">Total: ₹0</div>

            <div class="form-group">
                <label for="cust-name">आपका नाम 👤</label>
                <input type="text" id="cust-name" placeholder="अपना नाम लिखें">
            </div>
            <div class="form-group">
                <label for="cust-address">पता 📍</label>
                <textarea id="cust-address" rows="2" placeholder="पूरा पता लिखें"></textarea>
            </div>

            <button class="btn whatsapp-btn" onclick="sendWhatsAppOrder()">Order on WhatsApp 📲</button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="text-align:center; color:#777;">कार्ट खाली है।</p>';
                cartTotalDiv.innerText = 'Total: ₹0';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                html += `<div class="cart-item">
                    <span>${item.name}</span>
                    <span>₹${item.price}</span>
                </div>`;
            });

            cartItemsDiv.innerHTML = html;
            cartTotalDiv.innerText = `Total: ₹${total}`;
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert('कृपया पहले कार्ट में प्रोडक्ट जोड़ें!');
                return;
            }
            const name = document.getElementById('cust-name').value;
            const address = document.getElementById('cust-address').value;

            if (!name || !address) {
                alert('कृपया अपना नाम और पता भरें!');
                return;
            }

            let orderDetails = `*New Order from sumo Store*%0A%0A`;
            orderDetails += `*Customer:* ${name}%0A`;
            orderDetails += `*Address:* ${address}%0A%0A`;
            orderDetails += `*Items:*%0A`;

            let total = 0;
            cart.forEach(item => {
                orderDetails += `- ${item.name}: ₹${item.price}%0A`;
                total += item.price;
            });

            orderDetails += `%0A*Total Amount:* ₹${total}`;

            // अपना WhatsApp नंबर यहाँ बिना (+) के डालें (जैसे: 919876543210)
            const phoneNumber = "910000000000"; 
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${orderDetails}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
